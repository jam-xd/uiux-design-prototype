<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02. Seeker — Valorar al Giver — Wireframe Flujo 3</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/wireframe.css">
</head>
<body>
  <div class="wf-canvas-header">
    <span>SEEKER • 02. Valorar al Giver</span>
    <a class="wf-canvas-back" href="../../index.html">← Índice</a>
  </div>

  <main class="phone-frame">
    <section class="wf-content" style="padding-top: 26px;">
      <div>
        <h1 class="wf-title-lg" style="margin-bottom: 6px;">Valora tu experiencia</h1>
        <p class="wf-text-body">¿Cómo fue trabajar con María?</p>
      </div>

      <div class="wf-card">
        <div class="wf-card-title">María Rodríguez</div>
        <div class="wf-card-subtitle" style="margin-bottom: 0;">Giver • Diseño de identidad</div>
      </div>

      <div>
        <div class="wf-section-label">Califica el servicio</div>
        <div class="wf-stars" aria-label="4 de 5 estrellas">
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>☆</span>
        </div>
      </div>

      <div>
        <label class="wf-section-label" for="comentario-resena" style="display: block;">Cuéntanos más (opcional)</label>
        <textarea
          id="comentario-resena"
          class="wf-textarea"
          placeholder="Escribe un comentario sobre tu experiencia..."
        ></textarea>
      </div>

      <div>
        <div class="wf-section-label">¿Qué destacarías?</div>
        <div class="wf-chips">
          <span class="wf-chip">Puntualidad</span>
          <span class="wf-chip">Calidad</span>
          <span class="wf-chip">Comunicación</span>
        </div>
      </div>

      <div class="wf-spacer"></div>

      <a class="wf-btn wf-btn--primary" href="03-seeker-completado.html">
        Enviar reseña
      </a>
    </section>
  </main>
</body>
</html>
