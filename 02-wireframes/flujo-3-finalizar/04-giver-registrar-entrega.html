<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04. Giver — Registrar entrega — Wireframe Flujo 3</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/wireframe.css">
</head>
<body>
  <div class="wf-canvas-header">
    <span>GIVER • 04. Registrar entrega</span>
    <a class="wf-canvas-back" href="../../index.html">← Índice</a>
  </div>

  <main class="phone-frame">
    <section class="wf-content" style="padding-top: 26px;">
      <div>
        <h1 class="wf-title-lg" style="margin-bottom: 6px;">Finalizar servicio</h1>
        <p class="wf-text-body">Registra la entrega de tu trabajo para que el cliente pueda revisarla.</p>
      </div>

      <div>
        <div class="wf-section-label">Checklist de entrega</div>
        <div class="wf-check-list">
          <div class="wf-check-row">
            <span class="wf-check-box" aria-hidden="true"></span>
            <span>Servicio realizado</span>
          </div>
          <div class="wf-check-row">
            <span class="wf-check-box" aria-hidden="true"></span>
            <span>Entrega revisada</span>
          </div>
          <div class="wf-check-row">
            <span class="wf-check-box" aria-hidden="true"></span>
            <span>Requerimientos cumplidos</span>
          </div>
        </div>
      </div>

      <div>
        <div class="wf-section-label">Evidencia fotográfica</div>
        <div class="wf-evidence-box">
          + Subir fotografía
        </div>
      </div>

      <div>
        <label class="wf-section-label" for="observaciones-entrega" style="display: block;">Observaciones</label>
        <textarea
          id="observaciones-entrega"
          class="wf-textarea"
          style="min-height: 82px;"
          placeholder="Describe brevemente el trabajo realizado..."
        ></textarea>
      </div>

      <div class="wf-spacer"></div>

      <a class="wf-btn wf-btn--primary" href="05-giver-servicio-entregado.html">
        Enviar entrega
      </a>
    </section>
  </main>
</body>
</html>
