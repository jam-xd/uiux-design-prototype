<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04. Confirmación y siguientes pasos — Wireframe Flujo 1</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/wireframe.css">
</head>
<body>
  <div class="wf-canvas-header">
    <span>04. Confirmación y siguientes pasos</span>
    <a class="wf-canvas-back" href="../../index.html">← Índice</a>
  </div>

  <main class="phone-frame">
    <section class="wf-content wf-content--centered">
      <div class="wf-progress" aria-label="Paso 3 de 3 completado" style="margin-bottom: 12px;">
        <div class="wf-progress-step wf-progress-step--active"></div>
        <div class="wf-progress-step wf-progress-step--active"></div>
        <div class="wf-progress-step wf-progress-step--active"></div>
      </div>

      <div class="wf-check-circle" aria-hidden="true">✓</div>

      <h1 class="wf-title-lg">Solicitud confirmada</h1>

      <p class="wf-text-body">El oferente tiene un plazo límite para responder tu solicitud.</p>

      <div class="wf-callout" style="margin-top: 6px; margin-bottom: 6px;">
        <div class="wf-callout-label">¿QUÉ PASA AHORA?</div>
        <ol class="wf-callout-list">
          <li>Se envía la notificación al oferente.</li>
          <li>Se habilita el chat de coordinación.</li>
        </ol>
      </div>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
        <a class="wf-btn wf-btn--primary" href="05-panel-seguimiento.html">
          Ver estado del intercambio
        </a>
        <a class="wf-btn wf-btn--secondary" href="01-explorar.html">
          Volver al inicio
        </a>
      </div>
    </section>
  </main>
</body>
</html>
