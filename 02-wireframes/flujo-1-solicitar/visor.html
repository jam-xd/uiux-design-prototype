<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Flujo 1: Solicitar ayuda</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ececec;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .sr-radio {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .slide {
      display: none;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    #s1:checked ~ .slide-1,
    #s2:checked ~ .slide-2,
    #s3:checked ~ .slide-3,
    #s4:checked ~ .slide-4,
    #s5:checked ~ .slide-5,
    #s6:checked ~ .slide-6 {
      display: flex;
    }

    .toolbar {
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid #111111;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar-back {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border: 1px solid #111111;
      background: #f2f2f2;
    }

    .toolbar-steps {
      display: flex;
      gap: 6px;
    }

    .step-pill {
      padding: 5px 10px;
      border: 1px solid #888888;
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .step-pill--active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .toolbar-nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      padding: 6px 12px;
      border: 1px solid #111111;
      background: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn--primary {
      background: #111111;
      color: #ffffff;
    }

    .nav-btn--disabled {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 12px;
      flex: 1;
    }

    .stage iframe {
      width: 430px;
      max-width: 100%;
      height: 870px;
      border: none;
      background: transparent;
    }
  </style>
</head>
