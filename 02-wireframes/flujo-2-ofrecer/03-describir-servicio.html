<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03. Describir servicio — Wireframe Flujo 2</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/wireframe.css">
</head>
<body>
  <div class="wf-canvas-header">
    <span>03. Describir servicio (Paso 2/4)</span>
    <a class="wf-canvas-back" href="../../index.html">← Índice</a>
  </div>

  <main class="phone-frame">
    <header class="wf-topbar wf-topbar--no-border">
      <a class="wf-topbar-left" href="02-ofrecer-habilidad.html">
        <span>←</span>
        <span>Describir servicio</span>
      </a>
      <span class="wf-topbar-step">2/4</span>
    </header>

    <section class="wf-content">
      <div class="wf-progress wf-progress--4" aria-label="Paso 2 de 4">
        <div class="wf-progress-step wf-progress-step--active"></div>
        <div class="wf-progress-step wf-progress-step--active"></div>
        <div class="wf-progress-step"></div>
        <div class="wf-progress-step"></div>
      </div>
      <div class="wf-progress-label">Paso 2 de 4 • Descripción</div>

      <div>
        <label class="wf-field-label" for="nombre-servicio">Nombre del servicio *</label>
        <input id="nombre-servicio" class="wf-input" type="text" value="Ayuda con Excel">
      </div>

      <div>
        <label class="wf-field-label" for="desc-servicio">Descripción breve *</label>
        <textarea id="desc-servicio" class="wf-textarea" style="min-height: 76px;">Te ayudo a organizar tus datos y crear fórmulas básicas.</textarea>
      </div>

      <a class="wf-helper-link" href="#">? Ver ejemplo</a>

      <div>
        <div class="wf-field-label">Qué incluye *</div>
        <div class="wf-list-box">
          <span>- Organizar tablas</span>
          <span>- Fórmulas básicas</span>
          <span class="wf-list-add">+ Añadir</span>
        </div>
      </div>

      <div>
        <div class="wf-field-label">Qué no incluye *</div>
        <div class="wf-list-box">
          <span>- Macros / VBA</span>
          <span class="wf-list-add">+ Añadir</span>
        </div>
      </div>

      <div class="wf-spacer"></div>
    </section>

    <footer class="wf-footer-actions">
      <a class="wf-btn wf-btn--secondary wf-btn--back" href="02-ofrecer-habilidad.html">
        Atrás
      </a>
      <a class="wf-btn wf-btn--primary wf-btn--next" href="04-intercambio.html">
        Siguiente: Intercambio →
      </a>
    </footer>
  </main>
</body>
</html>
