<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02. Ofrecer habilidad — Wireframe Flujo 2</title>
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/wireframe.css">
</head>
<body>
  <div class="wf-canvas-header">
    <span>02. Ofrecer habilidad (Paso 1/4)</span>
    <a class="wf-canvas-back" href="../../index.html">← Índice</a>
  </div>

  <main class="phone-frame">
    <header class="wf-topbar wf-topbar--no-border">
      <a class="wf-topbar-left" href="01-mis-servicios.html">
        <span>✕</span>
        <span>Ofrecer habilidad</span>
      </a>
      <span class="wf-topbar-step">1/4</span>
    </header>

    <section class="wf-content">
      <div class="wf-progress wf-progress--4" aria-label="Paso 1 de 4">
        <div class="wf-progress-step wf-progress-step--active"></div>
        <div class="wf-progress-step"></div>
        <div class="wf-progress-step"></div>
        <div class="wf-progress-step"></div>
      </div>
      <div class="wf-progress-label">Paso 1 de 4 • Habilidad</div>

      <h1 class="wf-title-lg">¿Qué habilidad ofreces?</h1>

      <div class="wf-radio-list" role="radiogroup" aria-label="Categoría de habilidad">
        <div class="wf-radio-option wf-radio-option--selected">
          <span class="wf-radio-dot"></span>
          <span>Excel</span>
        </div>
        <div class="wf-radio-option">
          <span class="wf-radio-dot"></span>
          <span>Diseño</span>
        </div>
        <div class="wf-radio-option">
          <span class="wf-radio-dot"></span>
          <span>Tutorías</span>
        </div>
        <div class="wf-radio-option">
          <span class="wf-radio-dot"></span>
          <span>Soporte tecnológico</span>
        </div>
        <div class="wf-radio-option">
          <span class="wf-radio-dot"></span>
          <span>Otra</span>
        </div>
      </div>

      <div class="wf-card">
        <div class="wf-field-label" style="font-size: 12px; text-transform: uppercase;">Precisa tu habilidad (1 a 3)</div>
        <div class="wf-chips">
          <span class="wf-chip wf-chip--active">Fórmulas</span>
          <span class="wf-chip wf-chip--active">Orden de datos</span>
          <span class="wf-chip">Gráficos</span>
          <span class="wf-chip">Otra</span>
        </div>
      </div>

      <div class="wf-spacer"></div>
    </section>

    <footer class="wf-footer-actions">
      <a class="wf-btn wf-btn--primary wf-btn--next" href="03-describir-servicio.html">
        Siguiente: Descripción →
      </a>
    </footer>
  </main>
</body>
</html>
